services:
  - type: web
    name: kitchens
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    healthCheckPath: /api/stripe/status
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PUBLIC_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: DATA_DIR
        sync: false
